[package]
name = "roku-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "roku_cli"
path = "src/lib.rs"

[[bin]]
name = "roku"
path = "src/main.rs"

[features]
default = []
gui = ["dep:eframe"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
eframe = { version = "0.29", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
